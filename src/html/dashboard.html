<div x-data="dashboardComponent">
	<section id="oterview-section" class="grid gap-4 sm:gap-8">
		<h2 class="font-semibold text-3xl sm:text-4xl">Overview</h2>

		<div id="__conn" class="grid grid-cols-[repeat(auto-fit,minmax(24rem,1fr))] sm:grid-cols-[repeat(auto-fit,minmax(28rem,1fr))] gap-4 sm:gap-10">
			<div class="grid gap-4">
				<div
					x-data="dateRangePicker({ withToday: true, withLabel: true, startDate: formSearch._revenue_date_start, endDate: formSearch._revenue_date_end, labels: ['Tanggal Awal', 'Tanggal Akhir'], id: '-revenue' })"
					x-init="console.log('dateRangePicker init html')"
					class="flex items-start gap-4">
					<!-- START & END PICKERS -->
					<template x-for="picker in pickers" :key="picker.key">
						<div class="relative">
							<label class="block text-sm font-medium text-gray-700 mb-1" x-text="picker.label"></label>

							<div @click.stop="toggleCalendar(picker.key)" class="border rounded-lg px-3 py-2 bg-white w-44 cursor-pointer hover:border-blue-400 flex justify-between items-center">
								<span x-text="format(picker.key === 'start' ? startDate : endDate) || 'Select date'" class="text-gray-600 text-sm"></span>
								<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
									<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
								</svg>
							</div>

							<!-- CALENDAR -->
							<div x-show="open === picker.key" @click.away="open = null" x-transition class="absolute mt-2 bg-white border border-gray-200 rounded-lg shadow-lg p-4 z-50 w-80">
								<div class="text-sm font-medium text-gray-600 mb-1 text-center" x-show="withLabel && picker.key === open" x-text="picker.label"></div>

								<div class="flex justify-between items-center mb-2">
									<button @click="prevMonth" class="px-2 py-1 rounded hover:bg-gray-100">&lt;</button>
									<div class="text-gray-700 font-semibold" x-text="`${monthName()} ${currentYear}`"></div>
									<button @click="nextMonth" class="px-2 py-1 rounded hover:bg-gray-100">&gt;</button>
								</div>

								<div class="grid grid-cols-7 text-center text-xs font-semibold text-gray-500 mb-1">
									<template x-for="d in days" :key="d">
										<div x-text="d"></div>
									</template>
								</div>

								<div class="grid grid-cols-7 text-center text-sm">
									<template x-for="(day, index) in daysInMonth()" :key="index">
										<div class="p-1">
											<template x-if="day">
												<div
													@click="selectDay(day, picker.key)"
													class="rounded-lg py-1 cursor-pointer transition-all"
													:class="{
													'bg-blue-500 text-white': isSelected(day, picker.key),
													'bg-blue-100 text-blue-700': isInRange(day) && !isSelected(day, picker.key),
													'hover:bg-blue-50': !isInRange(day) && !isSelected(day, picker.key)
												}"
													x-text="day.getDate()"></div>
											</template>
										</div>
									</template>
								</div>

								<div class="flex justify-end mt-3" x-show="withToday">
									<button type="button" @click="selectDay(new Date(), picker.key)" class="text-blue-600 text-sm font-medium hover:underline">Select Today</button>
								</div>
							</div>
						</div>
					</template>

					<!-- CLEAR BUTTON -->
					<div class="pt-7">
						<button type="button" @click="clear()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm px-3 py-2 rounded-lg">Clear</button>

						<button type="button" @click="() => getRevenue()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm px-3 py-2 rounded-lg">Cari</button>
					</div>
				</div>

							<svg class="text-white aspect-square w-8" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
								<g id="SVGRepo_bgCarrier" stroke-width="0"></g>
								<g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
								<g id="SVGRepo_iconCarrier">
									<path
										d="M6.29977 5H21L19 12H7.37671M20 16H8L6 3H3M9 20C9 20.5523 8.55228 21 8 21C7.44772 21 7 20.5523 7 20C7 19.4477 7.44772 19 8 19C8.55228 19 9 19.4477 9 20ZM20 20C20 20.5523 19.5523 21 19 21C18.4477 21 18 20.5523 18 20C18 19.4477 18.4477 19 19 19C19.5523 19 20 19.4477 20 20Z"
										stroke="currentColor"
										stroke-width="2"

										stroke-linejoin="round"></path>
								</g>
							</svg>
						</div>

						</div>
					</div>
				</div>
