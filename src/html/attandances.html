<div x-data="attandancesComponent" class="py-4 px-0 md:px-2">
	<h2 class="text-2xl font-bold mb-4">
		Manajemen
		<span x-text="appName"></span>
	</h2>

	<button id="button-add" @click="openModal" class="bg-[#62c700] hover:bg-green-600 text-white px-4 py-2 rounded mb-4">
		Tambah
		<span x-text="appName"></span>
	</button>

	<form id="formSearch" @submit.prevent="get(1)" class="flex items-center justify-between flex-row flex-wrap space-y-4 md:space-y-0 py-4 bg-white dark:bg-gray-900 relative gap-3">
		<div class="sr-only">DOR</div>

		<div
			x-data="dateRangePicker({ withToday: true, withLabel: true, startDate: formSearch.date_start, endDate: formSearch.date_end, labels: ['Tanggal Awal', 'Tanggal Akhir']})"
			x-init="console.log('dateRangePicker init html')"
			class="flex items-start gap-4">
			<!-- START & END PICKERS -->
			<template x-for="picker in pickers" :key="picker.key">
				<div class="relative">
					<label class="block text-sm font-medium text-gray-700 mb-1" x-text="picker.label"></label>

					<div @click.stop="toggleCalendar(picker.key)" class="border rounded-lg px-3 py-2 bg-white w-44 cursor-pointer hover:border-blue-400 flex justify-between items-center">
						<span x-text="format(picker.key === 'start' ? startDate : endDate) || 'Select date'" class="text-gray-600 text-sm"></span>
						<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
						</svg>
					</div>

					<!-- CALENDAR -->
					<div x-show="open === picker.key" @click.away="open = null" x-transition class="absolute mt-2 bg-white border border-gray-200 rounded-lg shadow-lg p-4 z-50 w-80">
						<div class="text-sm font-medium text-gray-600 mb-1 text-center" x-show="withLabel && picker.key === open" x-text="picker.label"></div>

						<div class="flex justify-between items-center mb-2">
							<button @click="prevMonth" class="px-2 py-1 rounded hover:bg-gray-100">&lt;</button>
							<div class="text-gray-700 font-semibold" x-text="`${monthName()} ${currentYear}`"></div>
							<button @click="nextMonth" class="px-2 py-1 rounded hover:bg-gray-100">&gt;</button>
						</div>

						<div class="grid grid-cols-7 text-center text-xs font-semibold text-gray-500 mb-1">
							<template x-for="d in days" :key="d">
								<div x-text="d"></div>
							</template>
						</div>

						<div class="grid grid-cols-7 text-center text-sm">
							<template x-for="(day, index) in daysInMonth()" :key="index">
								<div class="p-1">
									<template x-if="day">
										<div
											@click="selectDay(day, picker.key)"
											class="rounded-lg py-1 cursor-pointer transition-all"
											:class="{
                                                'bg-blue-500 text-white': isSelected(day, picker.key),
                                                'bg-blue-100 text-blue-700': isInRange(day) && !isSelected(day, picker.key),
                                                'hover:bg-blue-50': !isInRange(day) && !isSelected(day, picker.key)
                                            }"
											x-text="day.getDate()"></div>
									</template>
								</div>
							</template>
						</div>

						<div class="flex justify-end mt-3" x-show="withToday">
							<button type="button" @click="selectDay(new Date(), picker.key)" class="text-blue-600 text-sm font-medium hover:underline">Select Today</button>
						</div>
					</div>
				</div>
			</template>

			<!-- CLEAR BUTTON -->
			<div class="pt-7">
				<button type="button" @click="clear()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm px-3 py-2 rounded-lg">Clear</button>
			</div>
		</div>

		<div class="relative" x-data="dropdown">
			<button
				@click="toggleDropdown"
				class="inline-flex items-center text-gray-500 bg-white border border-gray-300 focus:outline-none hover:bg-gray-100 focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-sm px-4 py-2 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:border-gray-600 dark:focus:ring-gray-700"
				type="button">
				<span class="sr-only pr-3">Filter button</span>
				<span class="pr-1">Filter</span>
				<svg class="ml-4 w-2.5 h-2.5 ms-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
					<path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4" />
				</svg>
			</button>

			<!-- Dropdown menu -->
			<div
				x-show="isDropdownOpen"
				x-cloak=""
				@click.outside="disableDropdown"
				class="dropdown-menu top-full left-0 absolute z-10 bg-white divide-y divide-gray-100 rounded-lg shadow-md w-80 dark:bg-gray-700 dark:divide-gray-600">
				<ul class="grid grid-cols-2 py-1 text-sm text-gray-700 dark:text-gray-200" aria-labelledby="dropdownActionButton">
					<template x-for="(type, i) in types" :key="type">
						<li>
							<label :for="`s_${ type }`" class="flex items-center gap-2 px-4 py-2 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">
								<input type="checkbox" :id="`s_${ type }`" :name="type" x-model="formSearch.types" :value="typesText[i]" />
								<span x-text="typesText[i]"></span>
							</label>
						</li>
					</template>

					<template x-for="(filter, i) in statuses" :key="filter">
						<li>
							<label :for="`s_${ filter }`" class="flex items-center gap-2 px-4 py-2 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">
								<input type="checkbox" :id="`s_${ filter }`" :name="filter" x-model="formSearch.statuses" :value="filter" />
								<span x-text="filter"></span>
							</label>
						</li>
					</template>
				</ul>
			</div>
		</div>

		<div class="flex flex-wrap self-end gap-4 items-center">
			<label for="table-search" class="sr-only">Search</label>

			<template x-if="false">
				<div class="relative" x-data="{ isOpenDropdown: false }">
					<button
						@click="isOpenDropdown = !isOpenDropdown"
						class="inline-flex items-center text-gray-500 bg-white border border-gray-300 focus:outline-none hover:bg-gray-100 focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-sm px-4 py-2 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:border-gray-600 dark:focus:ring-gray-700"
						type="button">
						<span class="sr-only pr-3">Filter button</span>
						<span class="pr-1">Filter</span>
						<svg class="ml-4 w-2.5 h-2.5 ms-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
							<path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4" />
						</svg>
					</button>

					<!-- Dropdown menu -->
					<div
						x-show="isOpenDropdown"
						x-cloak=""
						@click.outside="isOpenDropdown = false"
						class="top-full left-0 absolute z-10 bg-white divide-y divide-gray-100 rounded-lg shadow-md w-80 dark:bg-gray-700 dark:divide-gray-600">
						<ul x-data="{ filter_labels: ['Nominal', 'Deskripsi']}" class="grid grid-cols-2 py-1 text-sm text-gray-700 dark:text-gray-200" aria-labelledby="dropdownActionButton">
							<template x-for="(filter, i) in ['amount', 'description']" :key="filter">
								<li>
									<label :for="`s_${ filter }`" class="flex items-center gap-2 px-4 py-2 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">
										<input type="checkbox" :id="`s_${ filter }`" :name="filter" x-model="formSearch.filters" :value="filter" />
										<span x-text="filter_labels[i]"></span>
									</label>
								</li>
							</template>
							<!-- <li>
                            <label for="s_name" class="flex items-center gap-2 px-4 py-2 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">
                                <input type="checkbox" id="s_name" name="name" x-model="formSearch.filters" value="name" />
                                <span>Nama</span>
                            </label>
                        </li> -->
							<li>
								<label for="sort_desc" class="flex items-center gap-2 px-4 py-2 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">
									<input type="checkbox" id="sort_desc" name="sort_desc" x-model="formSearch.sort_desc" />
									<span>Sortir Terbalik</span>
								</label>
							</li>
						</ul>
					</div>
				</div>
			</template>

			<div class="relative">
				<div class="absolute inset-y-0 rtl:inset-r-0 start-0 flex items-center ps-3 pointer-events-none">
					<svg class="ml-2 w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
						<path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z" />
					</svg>
				</div>
				<input
					type="search"
					id="table-search-users"
					name="keyword"
					x-model="formSearch.keyword"
					class="block pt-2 py-2 pl-8 text-sm text-gray-900 border border-gray-300 rounded-lg w-50 bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
					:placeholder="`Cari Data Absensi...`"
					autocomplete="off" />
			</div>

			<button type="submit" class="bg-[#62c700] hover:bg-green-600 text-white px-4 py-2 rounded text-sm">Cari</button>
		</div>
	</form>

	<div class="relative overflow-x-auto shadow-md sm:rounded-lg">
		<table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
			<thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
				<tr>
					<th scope="col" class="px-6 py-3">No</th>
					<th scope="col" class="px-6 py-3">Tanggal</th>
					<th scope="col" class="px-6 py-3">Time</th>
					<th scope="col" class="px-6 py-3">Username</th>
					<th scope="col" class="px-6 py-3">Type</th>
					<th scope="col" class="px-6 py-3">Status</th>
					<th scope="col" class="px-6 py-3">Aksi</th>
				</tr>
			</thead>
			<tbody>
				<template x-for="(attandance, index) in attandances" :key="attandance.id + ' ' + index">
					<tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600">
						<td class="px-6 py-4" x-text="index + page.start_index"></td>
						<td class="px-6 py-4 text-xs" x-text="attandance.date"></td>
						<td class="px-6 py-4 text-xs" x-text="attandance.time"></td>
						<td class="px-6 py-4" x-text="attandance.username"></td>
						<td class="px-6 py-4" x-text="attandance.type"></td>
						<td class="px-6 py-4" x-text="attandance.status"></td>
						<td class="px-6 py-4" x-text="IDR.format(attandance.salary)"></td>
						<td class="px-6 py-4">
							<!-- Modal toggle -->
							<!-- <button type="button" @click="selectAttandanceEdit(attandance)" class="btn-edit font-medium text-blue-600 dark:text-blue-500 hover:underline">Ubah</button> -->
							<button type="button" @click="remove(attandance)" class="btn-remove font-medium text-red-600 dark:text-red-500 hover:underline">Hapus</button>
						</td>
					</tr>
				</template>
				<tr x-show="!attandances.length">
					<th scope="col" colspan="5" class="px-4 py-4 text-xl font-bold text-center">Tidak ada data!</th>
				</tr>
			</tbody>
		</table>
	</div>

	<!-- Pagination -->
	<nav x-show="attandances.length" class="flex flex-wrap justify-between items-center gap-3 gap-x-5 pt-4" aria-label="Table navigation">
		<!-- Showing Info -->
		<div class="text-sm text-gray-600 dark:text-gray-300 text-center md:text-left mx-auto">
			Menampilkan
			<span class="font-semibold text-gray-900 dark:text-white">
				<span x-text="page.start_index"></span>
				-
				<span x-text="page.end_index"></span>
			</span>
			dari
			<span class="font-semibold text-gray-900 dark:text-white" x-text="page.total_data"></span>
			data.
		</div>

		<!-- Pagination Group -->
		<ul class="mx-auto self-center inline-flex -space-x-px rtl:space-x-reverse text-xs h-8 rounded-m md:text-sm" x-show="attandances.length">
			<li>
				<a
					href="#formSearch"
					@click="page.page != 1 && get(1)"
					:class="page.page === 1 ? 'pointer-events-none opacity-50' : ''"
					class="flex items-center justify-center px-3 md:px-3 h-8 md:h-8 ms-0 leading-tight text-gray-500 bg-white border border-gray-300 rounded-s-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">
					&laquo;
				</a>
			</li>
			<li>
				<a
					href="#formSearch"
					@click="page.page != 1 && get(page.page - 1)"
					:class="page.page === 1 ? 'pointer-events-none opacity-50' : ''"
					class="flex items-center justify-center px-3 md:px-3 h-8 md:h-8 ms-0 leading-tight text-gray-500 bg-white border border-gray-300 rounded-s-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">
					&lsaquo;
				</a>
			</li>

			<template x-for="(num,index) in page.buttons" :key="num">
				<li>
					<a
						href="#formSearch"
						@click="page.page != num && get(num)"
						x-text="num"
						:class="page.page != num ? ' text-gray-500 bg-white dark:bg-gray-800 dark:text-gray-400 ' : 'bg-gray-100 text-gray-700  dark:bg-gray-700 dark:text-white'"
						class="flex items-center justify-center px-3 md:px-3 h-8 md:h-8 leading-tight border border-gray-300 hover:bg-gray-100 hover:text-gray-700 dark:border-gray-700 dark:hover:bg-gray-700 dark:hover:text-white"></a>
				</li>
			</template>

			<li>
				<a
					href="#formSearch"
					@click="page.page != page.total_page && get(page.page+1)"
					:class="page.page === page.total_page ? 'pointer-events-none opacity-50' : ''"
					class="flex items-center justify-center px-3 md:px-3 h-8 md:h-8 leading-tight text-gray-500 bg-white border border-gray-300 rounded-e-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">
					&rsaquo;
				</a>
			</li>
			<li>
				<a
					href="#formSearch"
					@click="page.page != page.total_page && get(page.total_page)"
					:class="page.page === page.total_page ? 'pointer-events-none opacity-50' : ''"
					class="flex items-center justify-center px-3 md:px-3 h-8 md:h-8 leading-tight text-gray-500 bg-white border border-gray-300 rounded-e-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">
					&raquo;
				</a>
			</li>
		</ul>
	</nav>

	<!-- Main modal | Add & Edit -->
	<div id="mainModal" x-show="isOpenModal" x-cloak="" class="bg-[rgba(0,0,0,.5)] modal-conn">
		<div class="relative w-full max-w-2xl max-h-full" @click.outside="isOpenModal = false">
			<!-- Modal content -->
			<form id="form-main" class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700" @submit.prevent="form.id ? edit : add">
				<!-- Modal header -->
				<div class="flex items-start justify-between p-4 border-b rounded-t dark:border-gray-600 border-gray-200">
					<h3 class="text-xl font-semibold text-gray-900 dark:text-white">
						<span x-text="form.id ? 'Ubah' : 'Tambah'"></span>
						<span x-text="appName"></span>
					</h3>
					<button
						@click="isOpenModal = false"
						type="button"
						class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
						<svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
							<path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
						</svg>
						<span class="sr-only">Close modal</span>
					</button>
				</div>
				<!-- Modal body -->
				<div class="p-6 space-y-6">
					<div class="grid grid-cols-6 gap-6">
						<div class="col-span-6 sm:col-span-3">
							<label for="time" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Time</label>

							<input
								type="text"
								id="time"
								class="shadow-xs bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
								required=""
								:value="`${ date } | ${ time }`"
								disabled />
						</div>
						<!-- <div class="col-span-6 sm:col-span-3">
							<label for="date" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Tanggal</label>

							<input
								type="text"
								id="date"
								class="shadow-xs bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
								required=""
								x-model="date"
								disabled />
						</div> -->
						<!-- <div class="col-span-6 sm:col-span-3">
							<label for="time" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Waktu</label>
							<input
								type="text"
								id="time"
								class="shadow-xs bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
								required=""
								:value="time || 'DOR'"
								autocomplete="off"
								x-init="console.log('time:', time)"
								disabled />
						</div> -->

						<div class="col-span-6 sm:col-span-3">
							<label for="username" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Username</label>
							<template x-if="auth.level">
								<select
									id="username"
									x-model="form.username"
									@change="() => selectStaff(form.username)"
									class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
									<option value="">Pilih Staff</option>
									<template x-for="(staff, i) in staffs" :key="staff.username + '' + i">
										<option x-bind:selected="i == 0" x-text="staff.username" :value="staff.username"></option>
									</template>
								</select>
							</template>
							<template x-if="!auth.level">
								<input
									type="text"
									id="username"
									class="shadow-xs bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
									required=""
									:value="form.username"
									autocomplete="off"
									disabled />
							</template>
						</div>

						<!-- <div class="col-span-6 sm:col-span-3">
							<label for="type" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Type</label>
							<input
								type="search"
								id="type"
								x-model="form.type"
								list="type-list"
								autocomplete="off"
								class="shadow-xs bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
								required="" />

							<datalist id="type-list" style="width: 100%; position: absolute">
								<template x-for="(type, i, all) in typesText" :key="type">
									<option x-text="type"></option>
								</template>
							</datalist>
						</div> -->
						<div class="col-span-6 sm:col-span-3">
							<label for="type" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Type</label>
							<select
								id="type"
								x-model="form.type"
								class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
								<!-- <option>United States</option>
								<option>Canada</option>
								<option>France</option>
								<option>Germany</option> -->
								<option value="">Pilih Type</option>
								<template x-for="(type, i, all) in typesText" :key="type">
									<option x-bind:selected="i == 0" x-text="type" :value="type"></option>
								</template>
							</select>
						</div>
						<div class="col-span-6 sm:col-span-3">
