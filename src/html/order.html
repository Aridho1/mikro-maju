<div x-data="conn">
	<div x-data="tablesComponent" class="py-6 px-4 relative">
		<h2 class="text-2xl font-bold mb-4" x-data="{ init() { $watch('quantity', () => setCart()) } }">Pesan Produk</h2>

		<a href="#cart-list" class="z-50 block bottom-8 right-8 bg-white shadow-xl rounded-full p-3 hover:bg-gray-100 transition fixed">
			<div class="relative">
				<!-- Cart SVG -->
				<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6">
					<path
						d="M6.29977 5H21L19 12H7.37671M20 16H8L6 3H3M9 20C9 20.5523 8.55228 21 8 21C7.44772 21 7 20.5523 7 20C7 19.4477 7.44772 19 8 19C8.55228 19 9 19.4477 9 20ZM20 20C20 20.5523 19.5523 21 19 21C18.4477 21 18 20.5523 18 20C18 19.4477 18.4477 19 19 19C19.5523 19 20 19.4477 20 20Z"
						stroke="#000000"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round" />
				</svg>

				<!-- Badge -->
				<span
					x-show="quantity > 0"
					x-text="quantity"
					class="absolute -bottom-2 -right-2 bg-red-500 text-white text-xs w-5 h-5 flex items-center justify-center rounded-full text-center"></span>
			</div>
		</a>

		<section id="filter" class="mx-auto border border-slate-300 rounded-lg bg-slate-100 p-4 pb-4 flex flex-col gap-5">
			<form @submit.prevent @change="" id="filter-category" class="flex flex-col gap-3">
				<h2 class="text-lg font-medium text-gray-900 dark:text-white">Filter Kategori</h2>

				<div class="flex flex-wrap gap-x-2 gap-y-4">
					<template x-for="(subcategory, category) in categories" :key="category">
						<div>
							<input type="checkbox" :id="`category-${category}`" x-model="filterCategories[category].enabled" class="hidden peer" />
							<label
								:for="`category-${category}`"
								x-text="category"
								class="box-border px-3 py-1 text-sm bg-slate-200 rounded-lg cursor-pointer border-2 border-gray-200 peer-checked:border-blue-600"></label>
						</div>
					</template>
				</div>
			</form>

			<template x-if="false">
				<template x-for="(subcategory, category) in categories" :key="category">
					<template x-if="filterCategories[category].enabled">
						<form @submit.prevent @change="filterSubcategory" class="flex flex-col gap-4">
							<h3 class="text-md font-medium text-gray-900 dark:text-white">
								Filter Kategori
								<span x-text="category"></span>
							</h3>
							<div class="flex flex-wrap gap-x-2 gap-y-4">
								<template x-for="(subcategory, num) in categories[category]" :key="subcategory + index + num">
									<div>
										<input type="checkbox" :id="`category-${category}-${subcategory}`" x-model="filterCategories[category].items" :value="subcategory" class="hidden peer" />
										<label
											:for="`category-${category}-${subcategory}`"
											x-text="subcategory"
											class="box-border px-3 py-1 text-sm bg-slate-200 rounded-lg cursor-pointer border-2 border-gray-200 peer-checked:border-blue-600"></label>
									</div>
								</template>
							</div>
						</form>
					</template>
				</template>
			</template>

			<form id="formSearch" @submit.prevent="" class="flex items-center justify-between flex-column md:flex-row flex-wrap space-y-4 md:space-y-0 pt-4 relative gap-3">
				<div class="sr-only">DOR</div>

				<div class="relative">
					<div class="absolute inset-y-0 rtl:inset-r-0 start-0 flex items-center ps-3 pointer-events-none">
						<svg class="ml-2 w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
							<path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z" />
						</svg>
					</div>
					<input
						type="search"
						id="search-product"
						name="keyword"
						x-model="searchKeyword"
						class="block pt-2 py-2 pl-8 text-sm text-gray-900 border border-gray-300 rounded-lg w-60 bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
						placeholder="Cari Product..."
						autocomplete="off"
						list="product-list" />

					<datalist id="product-list">
						<template x-for="(product, index) in products" :key="product.name + '' + index">
							<option :value="product.name"></option>
						</template>
					</datalist>
				</div>

				<button type="submit" class="bg-[#62c700] hover:bg-green-600 text-white px-4 py-2 rounded text-sm">Cari</button>
			</form>
		</section>

		<div class="mx-auto flex flex-wrap py-4 justify-center gap-4">
			<!-- x-show="filterCategories[product.category]?.enabled && filterCategories[product.category].items.includes(product.subcategory)" -->
			<template x-for="(product, index) in products" :key="product.name + index">
				<div
					@click="selectItem(product)"
					x-show="filterCategories[product.category]?.enabled && product.name.toLowerCase().includes(searchKeyword.toLowerCase())"
					class="bg-white shadow rounded-lg overflow-hidden cursor-pointer flex-1 basis-36 max-w-[12rem]">
					<div class="h-28 md:h-32 bg-gray-100 overflow-hidden flex items-center justify-center relative">
						<img
							:src="`./src/img/db/${product.image}`"
							:alt="product.name"
							loading="lazy"
							class="w-full h-full object-cover duration-300 hover:scale-105 cursor-pointer text-center"
							@error="e => (e.target.classList.remove('w-full'), e.target.classList.remove('h-full'))" />

						<div class="absolute bottom-0 w-full">
							<div class="scale-75 translate-x-[10%] mr-0 relative flex items-center justify-end gap-1 flex-wrap p-1">
								<div class="text-xs text-yellow-700 bg-yellow-100 rounded px-2 py-1" x-text="product.category"></div>
								<div class="text-xs text-cyan-700 bg-cyan-100 rounded px-2 py-1" x-text="product.subcategory"></div>
							</div>
						</div>
					</div>

					<div class="py-4 px-2 flex flex-col gap-2">
						<h3 class="text-xs md:text-sm font-semibold text-gray-900 truncate" x-text="product.name">Nama Produk Contoh</h3>
						<p class="text-xs md:text-sm font-bold text-blue-600" x-text="IDR.format(product.price)">Rp 25.000</p>
						<!-- <p>
                            filter category:
                            <span x-text="!!filterCategories[product.category]?.enabled"></span>
                        </p>
                        <p>
                            filter search:
                            <span x-text="!!product.name.toLowerCase().includes(searchKeyword.toLowerCase())"></span>
                        </p> -->
					</div>
				</div>
			</template>
		</div>

		<!-- Cart -->
		<ul id="cart-list" class="scroll-mt-16 mx-auto max-w-xl divide-y divide-gray-200 dark:divide-gray-700 mb-20 mt-8">
			<template x-for="(item, index) in cart" :key="item.id + ' ' + index">
				<li class="py-3 sm:py-4">
					<div class="grid justify-between place-content-center grid-cols-[auto_1fr_5rem_5.5rem] gap-1">
						<!-- Gambar -->
						<div class="w-12 shrink-0 flex items-center">
							<img class="w-8 aspect-square rounded-full object-cover object-center" :src="`./src/img/db/${item.image}`" :alt="item.name" loading="lazy" />
						</div>

						<!-- Nama produk + harga satuan -->
						<div class="min-w-0">
							<p class="text-xs md:text-sm font-medium text-gray-900 truncate dark:text-white" x-tooltip="'Tooltip ini muncul saat tap atau hover'" x-text="item.name"></p>
							<p class="text-xs md:text-sm text-gray-500 truncate dark:text-gray-400">
								<span x-text="IDR.format(item.price)"></span>
								x
								<span x-text="item.quantity"></span>
							</p>
						</div>

						<!-- Quantity -->
						<div class="change-quantity flex justify-center items-center gap-2">
							<button @click="removeQuantity(item)" class="w-6 h-6 flex items-center justify-center bg-gray-200 rounded">&minus;</button>
							<span class="text-sm md:text-xs w-4 text-center" x-text="item.quantity"></span>
							<button @click="addQuantity(item)" class="w-6 h-6 flex items-center justify-center bg-gray-200 rounded">+</button>
						</div>

						<!-- Subtotal -->
						<div class="inline-flex items-center text-right text-xs md:text-sm font-semibold text-gray-900 dark:text-white truncate pl-1" x-tooltip="IDR.format(item.sub_total)">
							<span x-text="IDR.format(item.sub_total)">$999,999,999</span>
						</div>
					</div>
				</li>
			</template>
			<li x-show="cart.length" class="pb-3 sm:pb-4 relative">
				<div class="absolute right-0 inline-flex items-center border-b-2 border-black text-lg font-bold text-gray-900 dark:text-white" x-text="IDR.format(total)">$999</div>
			</li>
		</ul>

		<!-- Form -->
		<div class="py-8 mx-auto max-w-2xl lg:py-16">
			<h2 class="mb-4 text-xl font-bold text-gray-900 dark:text-white">Transaksi</h2>
			<form action="#" id="form-transaction" @submit.prevent="submit">
				<div class="grid gap-4 sm:grid-cols-2 sm:gap-6">
					<div class="w-full">
						<label for="price" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Harga Total</label>
						<input
							type="text"
							name="IDR-total"
							id="disabled-input-2"
							x-model="IDR.format(total)"
							aria-label="disabled input 2"
							class="bg-gray-100 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 cursor-not-allowed dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-gray-400 dark:focus:ring-blue-500 dark:focus:border-blue-500"
							readonly />
						<input type="hidden" name="total" x-model="total" />
					</div>

					<template x-if="false">
						<div>
							<label for="category" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Metode Pembayaran</label>
							<select
								x-model="payment_method"
								id="category"
								name="payment_method"
								class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
								<option selected="" value="Tunai">Tunai</option>
								<option value="QRIS">QRIS</option>
								<!-- <option value="Transfer">Transfer</option> -->
							</select>
						</div>

						<div class="w-full" x-show="payment_method === 'Tunai'">
							<label for="inputBuy" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Uang Tunai</label>
							<div class="flex gap-2">
								<input
									type="number"
									inputmode="numeric"
									id="inputBuy"
									x-model.number="inputBuy"
									min="0"
									class="shadow-xs bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-1/2 p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
									required="" />
								<input
									type="text"
									:value="inputBuy && !isNaN(inputBuy) ? IDR.format(inputBuy) : ''"
									placeholder="IDR"
									class="shadow-xs bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-1/2 p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
									placeholder="RP 25.000"
									required=""
									disabled />
							</div>
						</div>
						<div class="w-full" x-show="payment_method === 'Tunai'">
							<label for="price" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Kembalian</label>
							<input
								type="text"
								name="IDR-total"
								id="disabled-input-2"
								x-model="isNaN(inputBuy - total) ? '' : IDR.format(inputBuy - total)"
								aria-label="disabled input 2"
								class="bg-gray-100 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 cursor-not-allowed dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-gray-400 dark:focus:ring-blue-500 dark:focus:border-blue-500"
								readonly />
						</div>
					</template>
					<div class="w-full">
						<label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Nama</label>
						<input
							type="text"
							name="name"
							id="name"
							x-model="name"
							aria-label="Name"
							class="bg-gray-100 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-gray-400 dark:focus:ring-blue-500 dark:focus:border-blue-500 placeholder-shown:text-gray-500"
							placeholder="Nama pembeli..."
							autocomplete="off"
							required />
					</div>
				</div>
				<button
					type="submit"
					class="inline-flex items-center px-5 py-2.5 mt-4 sm:mt-6 text-sm font-medium text-center bg-[#62c700] hover:bg-green-600 text-white bg-primary-700 rounded-lg focus:ring-4 focus:ring-primary-200 dark:focus:ring-primary-900 hover:bg-primary-800">
					Pesan!
				</button>
			</form>
		</div>
	</div>

	<div
		x-data="{
		notifications: [],
		displayDuration: 8000,
		soundEffect: true,
		baseAudio: null,

		addNotification({ variant = 'info', sender = null, title = null, message = null }) {
			const id = Date.now()
			const notification = { id, variant, sender, title, message }

			console.log('Get new notification', notification)

			if (this.notifications.length >= 20) {
				this.notifications.splice(0, this.notifications.length - 19)
			}

			this.notifications.push(notification)

			if (this.soundEffect) {
				this.playSound()
			}
		},

		removeNotification(id) {
			setTimeout(() => {
				this.notifications = this.notifications.filter(
					(notification) => notification.id !== id,
				)
			}, 400)
		},

		playSound() {
			// clone instance, ini yang memungkinkan spam overlap
			const audio = this.baseAudio.cloneNode(true)
			audio.play().catch(err => console.error('Sound error:', err))
		},

		init() {
			this.baseAudio = new Audio('./src/sounds/ding (3).mp3')
			console.warn('Base audio loaded:', this.baseAudio)
		}
	}"
		x-on:notify.window="addNotification({
            variant: $event.detail.variant,
            sender: $event.detail.sender,
            title: $event.detail.title,
            message: $event.detail.message,
        })">
		<div
			x-on:mouseenter="$dispatch('pause-auto-dismiss')"
			x-on:mouseleave="$dispatch('resume-auto-dismiss')"
			class="group pointer-events-none fixed inset-x-8 top-0 z-[9999] flex max-w-full flex-col gap-2 bg-transparent px-6 py-6 md:bottom-0 md:left-[unset] md:right-0 md:top-[unset] md:max-w-sm">
			<template x-for="(notification, index) in notifications" x-bind:key="notification.id">
				<!-- root div holds all of the notifications  -->
				<div>
					<!-- Info Notification  -->
					<template x-if="notification.variant === 'info'">
						<div
							x-data="{ isVisible: false, timeout: null }"
							x-cloak
							x-show="isVisible"
							class="pointer-events-auto relative rounded-sm border border-sky-700 bg-zinc-50 text-neutral-600 dark:bg-zinc-900 dark:text-zinc-200"
							role="alert"
							x-on:pause-auto-dismiss.window="clearTimeout(timeout)"
							x-on:resume-auto-dismiss.window=" timeout = setTimeout(() => {(isVisible = false), removeNotification(notification.id) }, displayDuration)"
							x-init="$nextTick(() => { isVisible = true }), (timeout = setTimeout(() => { isVisible = false, removeNotification(notification.id)}, displayDuration))"
							x-transition:enter="transition duration-300 ease-out"
							x-transition:enter-end="translate-y-0"
							x-transition:enter-start="translate-y-8"
							x-transition:leave="transition duration-300 ease-in"
							x-transition:leave-end="-translate-x-24 opacity-0 md:translate-x-24"
							x-transition:leave-start="translate-x-0 opacity-100">
							<div class="flex w-full items-center gap-2.5 bg-sky-300 rounded-sm p-4 transition-all duration-300">
								<!-- Icon -->
								<div class="rounded-full bg-sky-500 p-0.5 text-sky-700" aria-hidden="true">
									<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="aspect-square w-5" aria-hidden="true">
										<path
											fill-rule="evenodd"
											d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-7-4a1 1 0 1 1-2 0 1 1 0 0 1 2 0ZM9 9a.75.75 0 0 0 0 1.5h.253a.25.25 0 0 1 .244.304l-.459 2.066A1.75 1.75 0 0 0 10.747 15H11a.75.75 0 0 0 0-1.5h-.253a.25.25 0 0 1-.244-.304l.459-2.066A1.75 1.75 0 0 0 9.253 9H9Z"
											clip-rule="evenodd" />
									</svg>
								</div>

								<!-- Title & Message -->
								<div class="flex flex-col gap-2">
									<h3 x-cloak x-show="notification.title" class="text-sm font-semibold text-sky-700" x-text="notification.title"></h3>
									<p x-cloak x-show="notification.message" style="text-wrap: pretty" class="text-sm" x-text="notification.message"></p>
								</div>

								<!--Dismiss Button -->
								<button type="button" class="ml-auto" aria-label="dismiss notification" x-on:click="(isVisible = false), removeNotification(notification.id)">
									<svg xmlns="http://www.w3.org/2000/svg viewBox=" 0 0 24 24 stroke="currentColor" fill="none" stroke-width="2" class="aspect-square w-5 shrink-0" aria-hidden="true">
										<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
									</svg>
								</button>
							</div>
						</div>
					</template>

					<!-- Success Notification  -->
					<template x-if="notification.variant === 'success'">
						<div
							x-data="{ isVisible: false, timeout: null }"
							x-cloak
							x-show="isVisible"
							class="pointer-events-auto relative rounded-sm border border-green-700 bg-zinc-50 text-neutral-600 dark:bg-zinc-900 dark:text-zinc-200"
							role="alert"
							x-on:pause-auto-dismiss.window="clearTimeout(timeout)"
							x-on:resume-auto-dismiss.window=" timeout = setTimeout(() => {(isVisible = false), removeNotification(notification.id) }, displayDuration)"
							x-init="$nextTick(() => { isVisible = true }), (timeout = setTimeout(() => { isVisible = false, removeNotification(notification.id)}, displayDuration))"
							x-transition:enter="transition duration-300 ease-out"
							x-transition:enter-end="translate-y-0"
							x-transition:enter-start="translate-y-8"
							x-transition:leave="transition duration-300 ease-in"
							x-transition:leave-end="-translate-x-24 opacity-0 md:translate-x-24"
							x-transition:leave-start="translate-x-0 opacity-100">
							<div class="flex w-full items-center gap-2.5 bg-green-700/10 rounded-sm p-4 transition-all duration-300">
								<!-- Icon -->
								<div class="rounded-full bg-green-700/15 p-0.5 text-green-700" aria-hidden="true">
									<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="aspect-square w-5" aria-hidden="true">
										<path
											fill-rule="evenodd"
											d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z"
											clip-rule="evenodd" />
									</svg>
								</div>

								<!-- Title & Message -->
								<div class="flex flex-col gap-2">
									<h3 x-cloak x-show="notification.title" class="text-sm font-semibold text-green-700" x-text="notification.title"></h3>
									<p x-cloak x-show="notification.message" class="text-pretty text-sm" x-text="notification.message"></p>
								</div>

								<!--Dismiss Button -->
								<button type="button" class="ml-auto" aria-label="dismiss notification" x-on:click="(isVisible = false), removeNotification(notification.id)">
									<svg xmlns="http://www.w3.org/2000/svg viewBox=" 0 0 24 24 stroke="currentColor" fill="none" stroke-width="2" class="aspect-square w-5 shrink-0" aria-hidden="true">
										<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
									</svg>
								</button>
							</div>
						</div>
					</template>

					<!-- Warning Notification  -->
					<template x-if="notification.variant === 'warning'">
						<div
							x-data="{ isVisible: false, timeout: null }"
							x-cloak
							x-show="isVisible"
							class="pointer-events-auto relative rounded-sm border border-amber-600 bg-zinc-50 text-neutral-600 dark:bg-zinc-900 dark:text-zinc-200"
							role="alert"
							x-on:pause-auto-dismiss.window="clearTimeout(timeout)"
							x-on:resume-auto-dismiss.window=" timeout = setTimeout(() => {(isVisible = false), removeNotification(notification.id) }, displayDuration)"
							x-init="$nextTick(() => { isVisible = true }), (timeout = setTimeout(() => { isVisible = false, removeNotification(notification.id)}, displayDuration))"
							x-transition:enter="transition duration-300 ease-out"
							x-transition:enter-end="translate-y-0"
							x-transition:enter-start="translate-y-8"
							x-transition:leave="transition duration-300 ease-in"
							x-transition:leave-end="-translate-x-24 opacity-0 md:translate-x-24"
							x-transition:leave-start="translate-x-0 opacity-100">
							<div class="flex w-full items-center gap-2.5 bg-amber-600/10 rounded-sm p-4 transition-all duration-300">
								<!-- Icon -->
								<div class="rounded-full bg-amber-600/15 p-0.5 text-amber-600" aria-hidden="true">
									<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="aspect-square w-5" aria-hidden="true">
										<path
											fill-rule="evenodd"
											d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-1.5 0v-4.5A.75.75 0 0 1 10 5Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"

						</div>

					<!-- Danger Notification  -->
					<template x-if="notification.variant === 'danger'">
						<div
							x-data="{ isVisible: false, timeout: null }"
							x-cloak
							x-show="isVisible"
							class="pointer-events-auto relative rounded-sm border border-red-700 bg-zinc-50 text-neutral-600 dark:bg-zinc-900 dark:text-zinc-200"
							role="alert"
							x-on:pause-auto-dismiss.window="clearTimeout(timeout)"
							x-on:resume-auto-dismiss.window=" timeout = setTimeout(() => {(isVisible = false), removeNotification(notification.id) }, displayDuration)"
							x-init="$nextTick(() => { isVisible = true }), (timeout = setTimeout(() => { isVisible = false, removeNotification(notification.id)}, displayDuration))"

							x-transition:enter-end="translate-y-0"
							x-transition:enter-start="translate-y-8"
							x-transition:leave="transition duration-300 ease-in"
							x-transition:leave-end="-translate-x-24 opacity-0 md:translate-x-24"
							x-transition:leave-start="translate-x-0 opacity-100">
							<div class="flex w-full items-center gap-2.5 bg-red-700/10 rounded-sm p-4 transition-all duration-300">
								<!-- Icon -->
								<div class="rounded-full bg-red-700/15 p-0.5 text-red-700" aria-hidden="true">
									<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="aspect-square w-5" aria-hidden="true">
										<path
											fill-rule="evenodd"
											d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-1.5 0v-4.5A.75.75 0 0 1 10 5Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
											clip-rule="evenodd" />
									</svg>
								</div>

								<!-- Title & Message -->
								<div class="flex flex-col gap-2">
									<h3 x-cloak x-show="notification.title" class="text-sm font-semibold text-red-700" x-text="notification.title"></h3>
									<p x-cloak x-show="notification.message" class="text-pretty text-sm" x-text="notification.message"></p>
								</div>

								<!--Dismiss Button -->
								<button type="button" class="ml-auto" aria-label="dismiss notification" x-on:click="(isVisible = false), removeNotification(notification.id)">
									<svg xmlns="http://www.w3.org/2000/svg viewBox=" 0 0 24 24 stroke="currentColor" fill="none" stroke-width="2" class="aspect-square w-5 shrink-0" aria-hidden="true">
										<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
									</svg>
								</button>
							</div>
						</div>
					</template>

					<!-- Message Notification  -->
					<template x-if="notification.variant === 'message'">
						<div
							x-data="{ isVisible: false, timeout: null }"
							x-cloak
							x-show="isVisible"
							class="pointer-events-auto relative rounded-sm border border-zinc-300 bg-zinc-50 text-neutral-600 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200"
							role="alert"
							x-on:pause-auto-dismiss.window="clearTimeout(timeout)"
							x-on:resume-auto-dismiss.window="timeout = setTimeout(() => { isVisible = false, removeNotification(notification.id) }, displayDuration)"
							x-init="$nextTick(() => { isVisible = true }), (timeout = setTimeout(() => { isVisible = false, removeNotification(notification.id) }, displayDuration))"
							x-transition:enter="transition duration-300 ease-out"
							x-transition:enter-end="translate-y-0"
							x-transition:enter-start="translate-y-8"
							x-transition:leave="transition duration-300 ease-in"
							x-transition:leave-end="-translate-x-24 opacity-0 md:translate-x-24"
							x-transition:leave-start="translate-x-0 opacity-100">
							<div class="flex w-full rounded-sm items-center gap-2.5 bg-zinc-100 p-4 transition-all duration-300 dark:bg-zinc-800">
								<div class="flex w-full items-center gap-2.5">
									<!-- Avatar -->
									<img
										x-cloak
										x-show="notification.sender.avatar"
										class="mr-2 aspect-square w-12 rounded-full"
										alt="avatar"
										aria-hidden="true"
										x-bind:src="notification.sender.avatar" />
									<div class="flex flex-col items-start gap-2">
										<!-- Title & Message -->
										<h3 x-cloak x-show="notification.sender.name" class="text-sm font-semibold text-neutral-900 dark:text-zinc-50" x-text="notification.sender.name"></h3>
										<p x-cloak x-show="notification.message" class="text-pretty text-sm" x-text="notification.message"></p>

										<!-- Action Buttons -->
										<div class="flex items-center gap-4">
											<button
												type="button"
												class="whitespace-nowrap bg-transparent text-center text-sm font-bold tracking-wide text-sky-700 transition hover:opacity-75 active:opacity-100 dark:text-sky-600">
												Reply

											<button
												type="button"
												class="whitespace-nowrap bg-transparent text-center text-sm font-bold tracking-wide text-neutral-600 transition hover:opacity-75 active:opacity-100 dark:text-zinc-200"
												x-on:click=" (isVisible = false), setTimeout(() => { removeNotification(notification.id) }, 400)">
												Dismiss
											</button>
										</div>
									</div>
								</div>

								<!-- Dismiss Button -->
								<button type="button" class="ml-auto" aria-label="dismiss notification" x-on:click="(isVisible = false), removeNotification(notification.id)">
									<svg xmlns="http://www.w3.org/2000/svg viewBox=" 0 0 24 24 stroke="currentColor" fill="none" stroke-width="2" class="aspect-square w-5 shrink-0" aria-hidden="true">
										<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
									</svg>
