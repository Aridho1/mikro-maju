                            x-transition:enter="transition ease-out duration-500"
                            x-transition:leave="transition ease-in duration-500"

                            x-bind:class="{ 'opacity-100 translate-x-0 duration-1000': false }"
                            x-transition:enter="{ 'opacity-0 translate-x-full duration-500': method == allowed_method[0], 'opacity-0 -translate-x-full duration-500': method == allowed_method[1] }"
                            x-transition:leave="{ 'opacity-0 translate-x-full duration-500': method == allowed_method[1], 'opacity-0 -translate-x-full duration-500': method == allowed_method[0] }"

                            x-transition:enter="transition ease-out duration-500"
                            x-transition:enter-start="opacity-0 transform scale-90"
                            x-transition:enter-end="opacity-100 transform scale-100"
                            x-transition:leave="transition ease-in duration-500"
                            x-transition:leave-start="opacity-100 transform scale-100"

                            x-transition:enter-start="opacity-0 translate-x-full"
                            x-transition:enter-end="opacity-100 translate-x-0"
                            x-transition:leave-start="opacity-100 translate-x-0"
                            x-transition:leave-end="opacity-0 -translate-x-full"

                            x-transition:leave-end="opacity-0 translate-x-full"

                            x-transition:enter-end="opacity-100 translate-x-0"

                            x-transition:enter-end="opacity-100 translate-x-0"

                            :x-transition:leave-end="method == allowed_method[0] ? 'opacity-0 -translate-x-full' : method == allowed_method[1] ? 'opacity-0 translate-x-full' : ''"
                        -->

						<div
							x-data="{
                               entering: false,
                                leaving: false,
                                entered: false,
                                transitioning: false 
                            }"
							x-show="currentSlide === index"
							x-cloak
							class="absolute inset-0 flex items-center gap-3 transition-transform duration-1000 ease-in"
							x-transition
							:class="{
                                'opacity-0 translate-x-full': transitioning && _method === 'next' && entering,
                                'opacity-0 -translate-x-full': transitioning && _method === 'prev' && entering,
                                'opacity-100 translate-x-0': transitioning && entered,

                                'opacity-0 -translate-x-full': transitioning && _method === 'next' && leaving,
                                'opacity-0 translate-x-full': transitioning && _method === 'prev' && leaving
                            }"
							@before-enter="entering = true; leaving = false; transitioning = true;"
							@after-enter="entering = false; entered = true; transitioning = false;"
							@before-leave="leaving = true; entering = false; transitioning = true;"
							@after-leave="leaving = false; entered = false; transitioning = false;">
							<div class="sr-only" x-show="false">
								<span>Initial readMore</span>
								<span
									x-init="
                                    descReadMore = getReadMore(slide.desc, 60)
                                    isDescReadMore = descReadMore == slide.desc
                                    console.log('slide.desc:', slide.desc)
                                    console.log('descReadMore:', descReadMore)
                                "></span>
							</div>
							<div class="flex-1 basis-[20%]">
								<img :src="`./src/img/db/${ slide.img }`" :alt="slide.title" class="!w-full h-full object-cover object-center" />
							</div>
							<div class="flex-1 slide-content grid gap-3">
								<h6 class="font-semibold sm:text-lg" x-text="slide.title"></h6>
								<p class="text-xs sm:text-base font-normal leading-7" x-text="descReadMore"></p>
							</div>
						</div>
					</template>
				</div>
