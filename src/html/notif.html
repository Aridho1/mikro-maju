	<!-- Notifications -->
	<div
		x-data="{
			notifications: [],
			displayDuration: 8000,
			soundEffect: true,
			baseAudio: null,
			interactionBound: false,   // memastikan listener tidak dobel
			recoveryTimer: null,       // cek berkala untuk auto-recover

			addNotification({ variant = 'info', sender = null, title = null, message = null }) {
				const id = Date.now()
				const notification = { id, variant, sender, title, message }

				console.log('Get new notification', notification)

				if (this.notifications.length >= 20) {
					this.notifications.splice(0, this.notifications.length - 19)
				}

				this.notifications.push(notification)

				if (this.soundEffect) {
					this.playSound()
				}
			},

			removeNotification(id) {
				setTimeout(() => {
					this.notifications = this.notifications.filter(n => n.id !== id)
				}, 400)
			},

			playSound() {
				const audio = this.baseAudio.cloneNode(true)

				audio.play().catch(err => {
					console.error('Sound error:', err)

					// Jika autoplay diblokir → pasang ulang listener
					if (err.name === 'NotAllowedError') {
						this.setupInteractionUnlock(true)
					}
				})
			},

			// AUTO FIX jika lost permission atau listener hilang
			setupInteractionUnlock(force = false) {
				if (this.interactionBound && !force) return

				console.warn('[AUDIO] Binding interaction unlock listener...')

				const unlock = () => {
					const a = this.baseAudio.cloneNode(true)
					a.volume = 0
					a.play().catch(_ => {})
					console.warn('[AUDIO] Unlocked by user interaction.')

					window.removeEventListener('click', unlock)
					this.interactionBound = false
				}

				this.interactionBound = true
				window.addEventListener('click', unlock)
			},

			init() {
				this.baseAudio = new Audio('./src/sounds/ding (3).mp3')
				console.warn('Base audio loaded:', this.baseAudio)

				// pertama kali load → lock siap
				this.setupInteractionUnlock()

				// periodic worker: kadang JS clear listener → pasang ulang otomatis
				this.recoveryTimer = setInterval(() => {
					if (!this.interactionBound) {
						// Test apakah play masih forbidden
						const t = this.baseAudio.cloneNode(true)
						t.volume = 0
						t.play().catch(err => {
							if (err.name === 'NotAllowedError') {
								console.warn('[AUDIO] Autoplay lost → rebinding listener.')
								this.setupInteractionUnlock(true)
							}
						})
					}
				}, 2000)
			}
		}"
		x-on:notify.window="addNotification({
            variant: $event.detail.variant,
            sender: $event.detail.sender,
            title: $event.detail.title,
            message: $event.detail.message,
        })">
		<div
			x-on:mouseenter="$dispatch('pause-auto-dismiss')"
			x-on:mouseleave="$dispatch('resume-auto-dismiss')"
			class="group pointer-events-none fixed inset-x-8 top-0 z-[9999] flex max-w-full flex-col gap-2 bg-transparent px-6 py-6 md:bottom-0 md:left-[unset] md:right-0 md:top-[unset] md:max-w-sm">
			<template x-for="(notification, index) in notifications" x-bind:key="notification.id">
				<!-- root div holds all of the notifications  -->
				<div>
					<!-- Info Notification  -->
					<template x-if="notification.variant === 'info'">

							class="pointer-events-auto relative rounded-sm border border-sky-700 bg-zinc-50 text-neutral-600 dark:bg-zinc-900 dark:text-zinc-200"
							role="alert"
							x-on:pause-auto-dismiss.window="clearTimeout(timeout)"
							x-on:resume-auto-dismiss.window=" timeout = setTimeout(() => {(isVisible = false), removeNotification(notification.id) }, displayDuration)"
							x-init="$nextTick(() => { isVisible = true }), (timeout = setTimeout(() => { isVisible = false, removeNotification(notification.id)}, displayDuration))"
							x-transition:enter="transition duration-300 ease-out"
							x-transition:enter-end="translate-y-0"
							x-transition:enter-start="translate-y-8"
							x-transition:leave="transition duration-300 ease-in"
							x-transition:leave-end="-translate-x-24 opacity-0 md:translate-x-24"
							x-transition:leave-start="translate-x-0 opacity-100">
							<div class="flex w-full items-center gap-2.5 bg-sky-300 rounded-sm p-4 transition-all duration-300">
								<!-- Icon -->
								<div class="rounded-full bg-sky-500 p-0.5 text-sky-700" aria-hidden="true">
									<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="aspect-square w-5" aria-hidden="true">
										<path
											fill-rule="evenodd"
											d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-7-4a1 1 0 1 1-2 0 1 1 0 0 1 2 0ZM9 9a.75.75 0 0 0 0 1.5h.253a.25.25 0 0 1 .244.304l-.459 2.066A1.75 1.75 0 0 0 10.747 15H11a.75.75 0 0 0 0-1.5h-.253a.25.25 0 0 1-.244-.304l.459-2.066A1.75 1.75 0 0 0 9.253 9H9Z"
											clip-rule="evenodd" />
									</svg>
								</div>

								<!-- Title & Message -->
								<div class="flex flex-col gap-2">
									<h3 x-cloak x-show="notification.title" class="text-sm font-semibold text-sky-700" x-text="notification.title"></h3>
									<p x-cloak x-show="notification.message" style="text-wrap: pretty" class="text-sm" x-text="notification.message"></p>
								</div>

								<!--Dismiss Button -->

									<svg xmlns="http://www.w3.org/2000/svg viewBox=" 0 0 24 24 stroke="currentColor" fill="none" stroke-width="2" class="aspect-square w-5 shrink-0" aria-hidden="true">
										<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
