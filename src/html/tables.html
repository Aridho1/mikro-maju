<div x-data="tablesComponent" class="py-4 px-0 md:px-2">
	<h2 class="text-2xl font-bold mb-4">
		Management
		<span x-text="appName"></span>
	</h2>

	<button id="button-add" @click="openModal" class="bg-[#62c700] hover:bg-green-600 text-white px-4 py-2 rounded mb-4">
		Tambah
		<span x-text="appName"></span>
	</button>

	<div class="relative overflow-x-auto shadow-md sm:rounded-lg">
		<table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
			<thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
				<tr>
					<th scope="col" class="px-6 py-3">No</th>
					<th scope="col" class="px-6 py-3">name</th>
					<th scope="col" class="px-6 py-3">Aksi</th>
				</tr>
			</thead>
			<tbody>
				<template x-for="(table, index) in tables" :key="table.id">
					<tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600">
						<td class="px-6 py-4" x-text="index + page.start_index"></td>
						<td class="px-6 py-4" x-text="table.name"></td>
						<td class="px-6 py-4">
							<!-- Modal toggle -->
							<button type="button" @click="selectTableEdit(table)" class="btn-edit font-medium text-blue-600 dark:text-blue-500 hover:underline">Ubah</button>
							<button type="button" @click="selectTableDetail(table)" class="btn-detail font-medium text-cyan-600 dark:text-cyan-500 hover:underline">Detail</button>
							<button type="button" @click="remove(table)" class="btn-remove font-medium text-red-600 dark:text-red-500 hover:underline">Hapus</button>
						</td>
					</tr>
				</template>
				<tr x-show="!tables.length">
					<th scope="col" colspan="9" class="px-4 py-4 text-xl font-bold text-center">Tidak ada data!</th>
				</tr>
			</tbody>
		</table>
	</div>

	<!-- Main modal | Add & Edit -->
	<div id="mainModal" x-show="isOpenModal" x-cloak="" class="bg-[rgba(0,0,0,.5)] modal-conn">
		<div class="relative w-full max-w-2xl max-h-full" @click.outside="isOpenModal = false">
			<!-- Modal content -->
			<form id="form-main" class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700" @submit.prevent="form.id ? edit : add">
				<!-- Modal header -->
				<div class="flex items-start justify-between p-4 border-b rounded-t dark:border-gray-600 border-gray-200">
					<h3 class="text-xl font-semibold text-gray-900 dark:text-white">
						<span x-text="form.id ? 'Ubah' : 'Tambah'"></span>
						<span x-text="appName"></span>
					</h3>
					<button
						@click="isOpenModal = false"
						type="button"
						class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
						<svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
							<path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
						</svg>
						<span class="sr-only">Close modal</span>
					</button>
				</div>
				<!-- Modal body -->
				<div class="p-6 space-y-6">
					<div class="grid grid-cols-6 gap-6">
						<div class="col-span-6 sm:col-span-3">
							<label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Nama</label>
							<input
								type="text"
								id="name"
								x-model="form.name"
								class="shadow-xs bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
								required=""
								autocomplete="off" />
						</div>
					</div>
				</div>
				<!-- Modal footer -->
				<div class="flex items-center p-6 space-x-3 rtl:space-x-reverse border-t border-gray-200 rounded-b dark:border-gray-600">
					<button
						type="submit"
						class="text-white bg-[#62c700] hover:bg-green-600 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
						x-text="form.id ? 'Ubah' : 'Tambah'"></button>
				</div>
			</form>
		</div>
	</div>

	<!-- Description QR -->
	<div x-show="qrDetail" x-cloak="" class="bg-[rgba(0,0,0,.5)] modal-conn">
		<div class="relative max-w-2xl max-h-full flex items-center justify-center w-max" @click.outside="qrDetail = null">
			<div class="bg-white px-5 py-3 rounded-lg min-w-[15rem]">
				<p class="font-bold text-lg mb-3">
					Nama:
					<span x-text="qrDetail?.name"></span>
				</p>

				<div id="qr-code" class="w-20 aspect-square"></div>

				<p class="mt-3 break-all">
					Link:
					<a :href="qrDetail?.__url" target="_blank" class="text-blue-600 hover:underline" x-text="qrDetail?.__url"></a>
				</p>
			</div>

			<!-- <img class="w-64 object-cover object-center" :src="`./src/img/db/${imageModal}`" alt="Image Modal" loading="lazy" /> -->
		</div>
	</div>
</div>
