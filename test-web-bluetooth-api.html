<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Test WEB BLUETOOTH API</title>
	</head>
	<body>
		<h1>TEST WEB BLUETOOTH API</h1>

		<button id="click-me">Klik saya</button>

		<script>
			const { log } = console;

			function onButtonClick() {
				log("Requesting Bluetooth Device...");
				navigator.bluetooth
					.requestDevice({ filters: [{ services: ["battery_service"] }] })
					.then((device) => {
						log("Connecting to GATT Server...");
						return device.gatt.connect();
					})
					.then((server) => {
						log("Getting Battery Service...");
						return server.getPrimaryService("battery_service");
					})
					.then((service) => {
						log("Getting Battery Level Characteristic...");
						return service.getCharacteristic("battery_level");
					})
					.then((characteristic) => {
						log("Reading Battery Level...");
						return characteristic.readValue();
					})
					.then((value) => {
						let batteryLevel = value.getUint8(0);
						log("> Battery Level is " + batteryLevel + "%");
					})
					.catch((error) => {
						log("Argh! " + error);
					});
			}

			document.addEventListener("DOMContentLoaded", function () {
				document.getElementById("click-me").addEventListener("click", onButtonClick);
			});
		</script>
	</body>
</html>
