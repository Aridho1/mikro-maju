<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Order Sender</title>
	</head>
	<body>
		<h3>Send Order</h3>
		<form id="f">
			<label>
				Amount:
				<input name="amount" type="number" required />
			</label>
			<br />
			<br />
			<label>
				Note:
				<input name="note" type="text" />
			</label>
			<br />
			<br />
			<button type="submit">Send</button>
		</form>
		<pre id="out"></pre>

		<script>
			const out = document.getElementById("out");
			document.getElementById("f").addEventListener("submit", async (e) => {
				console.log(e);
				e.preventDefault();
				const fd = new FormData(e.target);
				const payload = {
					amount: fd.get("amount"),
					note: fd.get("note"),
				};
				try {
					fd.forEach((v, k) => console.log(k, v));
					// const fdJson = JSON.stringify(payload);
					// console.log(fdJson);
					const r = await fetch("./src/php/add-order.php", {
						method: "POST",
						body: fd, // ⬅ remove headers, let browser set boundary
					});
					const json = await r.json();
					console.log(json);
					out.textContent = JSON.stringify(json, null, 2);
				} catch (err) {
					out.textContent = String(err);
				}
			});
		</script>
	</body>
</html>
